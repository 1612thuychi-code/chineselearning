    // Helper: safe JSON parse trying to extract JSON substring when responses include extra text
    function safeParseJSON(text) {
      if (!text) return null;
      try {
        return JSON.parse(text);
      } catch (err) {
        // try to extract first {...} block
        const start = text.indexOf('{');
        const end = text.lastIndexOf('}');
        if (start !== -1 && end !== -1 && end > start) {
          const sub = text.slice(start, end + 1);
          try { return JSON.parse(sub); } catch (e) { return null; }
        }
        return null;
      }
    }

    function App() {
      const [lang, setLang] = useState('vi');
      const [activeTab, setActiveTab] = useState('manage');
      const [vocabList, setVocabList] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');

      const t = UI_TEXT[lang];

      // Form state
      const [newHanzi, setNewHanzi] = useState('');
      const [newPinyin, setNewPinyin] = useState('');
      const [newMeaningVi, setNewMeaningVi] = useState('');
      const [newMeaningEn, setNewMeaningEn] = useState('');
      const [selectedHsk, setSelectedHsk] = useState('HSK3');
      const [isAiAutofilling, setIsAiAutofilling] = useState(false);
      const [aiGeneratedExample, setAiGeneratedExample] = useState(null);

      const hasGeminiKey = Boolean(GEMINI_API_KEY && GEMINI_API_KEY.length > 8);

      // Load from localStorage on mount
      useEffect(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed)) setVocabList(parsed);
          }
        } catch (err) {
          console.warn('Failed to load vocab from localStorage', err);
        }
      }, []);

      // Save to localStorage when vocabList changes
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(vocabList));
        } catch (err) {
          console.warn('Failed to save vocab to localStorage', err);
        }
      }, [vocabList]);

      // AI Autofill with Gemini
      const handleAiAutofill = async () => {
        if (!newHanzi.trim()) {
          alert(lang === 'vi' ? 'Vui lòng nhập Hán tự trước!' : 'Please enter a Hanzi character or word first!');
          return;
        }

        if (!hasGeminiKey) {
          alert(lang === 'vi'
            ? 'Chưa có khóa Gemini. AI tạm tắt. Bạn có thể nhập thủ công hoặc nhập từ file.'
            : 'No Gemini key configured. AI is disabled. You can fill fields manually or import a vocabulary file.');
          return;
        }

        setIsAiAutofilling(true);
        const systemPrompt = `You are an expert Chinese language tutor. Given a Chinese word "${newHanzi.trim()}" and HSK target level ${selectedHsk}, output a JSON object with keys:\n- pinyin: correct Pinyin with tone marks\n- meaningVi: accurate Vietnamese translation\n- meaningEn: accurate English translation\n- exampleHanzi: 1 example sentence in Chinese for ${selectedHsk}\n- examplePinyin: Pinyin of example sentence\n- exampleTranslationVi: Vietnamese translation of sentence\n- exampleTranslationEn: English translation of sentence`;

        const payload = {
          contents: [{ parts: [{ text: `Word: "${newHanzi.trim()}", Level: ${selectedHsk}` }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: { responseMimeType: "application/json" }
        };

        let retries = 0;
        const maxRetries = 3;
        let delay = 1000;

        while (retries <= maxRetries) {
          try {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              }
            );

            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

            const data = await response.json();
            const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            const parsed = safeParseJSON(jsonText);
            if (parsed) {
              if (parsed.pinyin) setNewPinyin(parsed.pinyin);
              if (parsed.meaningVi) setNewMeaningVi(parsed.meaningVi);
              if (parsed.meaningEn) setNewMeaningEn(parsed.meaningEn);
              setAiGeneratedExample({
                exampleHanzi: parsed.exampleHanzi,
                examplePinyin: parsed.examplePinyin,
                exampleTranslationVi: parsed.exampleTranslationVi,
                exampleTranslationEn: parsed.exampleTranslationEn
              });
            } else {
              console.warn('AI returned invalid JSON:', jsonText);
              alert(lang === 'vi' ? 'AI trả về dữ liệu không hợp lệ.' : 'AI returned invalid data.');
            }
            break;
          } catch (err) {
            retries++;
            if (retries > maxRetries) {
              console.error("AI Autofill failed:", err);
              alert(lang === 'vi' ? 'Không thể kết nối AI. Vui lòng thử lại sau.' : 'Failed to reach AI tutor. Please try again.');
            } else {
              await new Promise(res => setTimeout(res, delay));
              delay *= 2;
            }
          }
        }
        setIsAiAutofilling(false);
      };

      const handleAddWord = (e) => {
        e.preventDefault();
        if (!newHanzi.trim()) return;

        const newEntry = {
          id: Date.now().toString(),
          hanzi: newHanzi.trim(),
          pinyin: newPinyin.trim() || '...',
          meaningVi: newMeaningVi.trim() || '...',
          meaningEn: newMeaningEn.trim() || '...',
          hskLevel: selectedHsk,
          exampleHanzi: aiGeneratedExample?.exampleHanzi || `${newHanzi} 很重要。`,
          examplePinyin: aiGeneratedExample?.examplePinyin || `${newPinyin || newHanzi} hěn zhòngyào.`,
          exampleTranslation: lang === 'vi' 
            ? (aiGeneratedExample?.exampleTranslationVi || `${newMeaningVi || newHanzi} rất quan trọng.`) 
            : (aiGeneratedExample?.exampleTranslationEn || `${newMeaningEn || newHanzi} is very important.`)
        };

        setVocabList([newEntry, ...vocabList]);
        setNewHanzi('');
        setNewPinyin('');
        setNewMeaningVi('');
        setNewMeaningEn('');
        setAiGeneratedExample(null);
      };

      const handleDeleteWord = (id) => {
        setVocabList(vocabList.filter(item => item.id !== id));
      };

      // Export / Import
      const handleExportJSON = () => {
        const blob = new Blob([JSON.stringify(vocabList, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'vocab_list.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };

      const handleImportJSON = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (Array.isArray(parsed)) {
              // basic validation: ensure objects have hanzi
              const filtered = parsed.filter(p => p && p.hanzi);
              setVocabList(filtered.map((p, idx) => ({ ...p, id: p.id || `import-${Date.now()}-${idx}`})));
              alert(lang === 'vi' ? 'Nhập từ thành công!' : 'Import successful!');
            } else {
              alert('Invalid file format');
            }
          } catch (err) {
            alert('Failed to parse JSON file');
          }
        };
        reader.readAsText(file);
      };

      const filteredVocab = vocabList.filter(item => {
        const q = searchQuery.toLowerCase();
        return (
          item.hanzi.toLowerCase().includes(q) ||
          (item.pinyin || '').toLowerCase().includes(q) ||
          (item.meaningVi || '').toLowerCase().includes(q) ||
          (item.meaningEn || '').toLowerCase().includes(q)
        );
      });

      return (
        <div>
          {/* HEADER */}
          <header className="bg-gradient-to-r from-purple-700 via-indigo-600 to-purple-800 text-white shadow-lg sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-white/15 p-2 rounded-xl backdrop-blur-md border border-white/20 shadow-inner">
                  <i data-lucide="book-open" className="w-8 h-8 text-purple-100"></i>
                </div>
                <div>
                  <h1 className="text-2xl font-bold tracking-tight">{t.title}</h1>
                  <p className="text-xs text-purple-200">{t.subtitle}</p>
                </div>
              </div>

              {/* Language Selector */}
              <div className="flex items-center gap-1.5 bg-black/20 p-1.5 rounded-xl backdrop-blur-md border border-white/10">
                <i data-lucide="globe" className="w-4 h-4 text-purple-200 ml-1.5"></i>
                <button
                  onClick={() => setLang('vi')}
                  className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all ${
                    lang === 'vi' ? 'bg-white text-purple-700 shadow-md font-bold' : 'text-purple-100 hover:bg-white/10'
                  }`}
                >
                  Tiếng Việt
                </button>
                <button
                  onClick={() => setLang('en')}
                  className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all ${
                    lang === 'en' ? 'bg-white text-purple-700 shadow-md font-bold' : 'text-purple-100 hover:bg-white/10'
                  }`}
                >
                  English
                </button>
              </div>
            </div>

            {/* TAB NAVIGATION */}
            <div className="max-w-6xl mx-auto px-4 mt-1 flex overflow-x-auto gap-2 border-t border-white/10 pt-2 no-scrollbar">
              <button
                onClick={() => setActiveTab('manage')}
                className={`flex items-center gap-2 px-4 py-2 rounded-t-xl text-sm font-medium transition-all ${
                  activeTab === 'manage' ? 'bg-slate-50 text-purple-700 font-bold shadow-md' : 'text-purple-100 hover:bg-white/10'
                }`}
              >
                <i data-lucide="plus" className="w-4 h-4"></i> {t.navManage} ({vocabList.length})
              </button>

              <button
                onClick={() => setActiveTab('aiTutor')}
                className={`flex items-center gap-2 px-4 py-2 rounded-t-xl text-sm font-medium transition-all ${
                  activeTab === 'aiTutor' ? 'bg-slate-50 text-purple-700 font-bold shadow-md' : 'text-purple-100 hover:bg-white/10'
                }`}
              >
                <i data-lucide="sparkles" className="w-4 h-4 text-amber-300"></i> {t.navAiTutor}
              </button>

              <button
                onClick={() => setActiveTab('practice')}
                className={`flex items-center gap-2 px-4 py-2 rounded-t-xl text-sm font-medium transition-all ${
                  activeTab === 'practice' ? 'bg-slate-50 text-purple-700 font-bold shadow-md' : 'text-purple-100 hover:bg-white/10'
                }`}
              >
                <i data-lucide="edit-3" className="w-4 h-4"></i> {t.navPractice}
              </button>

              <button
                onClick={() => setActiveTab('quiz')}
                className={`flex items-center gap-2 px-4 py-2 rounded-t-xl text-sm font-medium transition-all ${
                  activeTab === 'quiz' ? 'bg-slate-50 text-purple-700 font-bold shadow-md' : 'text-purple-100 hover:bg-white/10'
                }`}
              >
                <i data-lucide="award" className="w-4 h-4"></i> {t.navQuiz}
              </button>

              <button
                onClick={() => setActiveTab('game')}
                className={`flex items-center gap-2 px-4 py-2 rounded-t-xl text-sm font-medium transition-all ${
                  activeTab === 'game' ? 'bg-slate-50 text-purple-700 font-bold shadow-md' : 'text-purple-100 hover:bg-white/10'
                }`}
              >
                <i data-lucide="grid" className="w-4 h-4"></i> {t.navGame}
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="max-w-6xl mx-auto px-4 mt-6">
            {activeTab === 'manage' && (
              <ManageTab
                vocabList={filteredVocab}
                allVocabCount={vocabList.length}
                onAddWord={handleAddWord}
                onDeleteWord={handleDeleteWord}
                newHanzi={newHanzi}
                setNewHanzi={setNewHanzi}
                newPinyin={newPinyin}
                setNewPinyin={setNewPinyin}
                newMeaningVi={newMeaningVi}
                setNewMeaningVi={setNewMeaningVi}
                newMeaningEn={newMeaningEn}
                setNewMeaningEn={setNewMeaningEn}
                selectedHsk={selectedHsk}
                setSelectedHsk={setSelectedHsk}
                handleAiAutofill={handleAiAutofill}
                isAiAutofilling={isAiAutofilling}
                aiGeneratedExample={aiGeneratedExample}
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                lang={lang}
                t={t}
                hasGeminiKey={hasGeminiKey}
                onExportJSON={handleExportJSON}
                onImportJSON={handleImportJSON}
              />
            )}

            {activeTab === 'aiTutor' && (
              <AiTutorTab vocabList={vocabList} lang={lang} t={t} hasGeminiKey={hasGeminiKey} />
            )}

            {activeTab === 'practice' && (
              <PracticeTab vocabList={vocabList} lang={lang} t={t} />
            )}

            {activeTab === 'quiz' && (
              <QuizTab vocabList={vocabList} lang={lang} t={t} />
            )}

            {activeTab === 'game' && (
              <GameTab vocabList={vocabList} lang={lang} t={t} />
            )}
          </main>
        </div>
      );
    }

    // MANAGE TAB COMPONENT
    function ManageTab({
      vocabList, allVocabCount, onAddWord, onDeleteWord,
      newHanzi, setNewHanzi, newPinyin, setNewPinyin,
      newMeaningVi, setNewMeaningVi, newMeaningEn, setNewMeaningEn,
      selectedHsk, setSelectedHsk, handleAiAutofill, isAiAutofilling,
      aiGeneratedExample, searchQuery, setSearchQuery, lang, t,
      hasGeminiKey, onExportJSON, onImportJSON
    }) {
      useEffect(() => { lucide.createIcons(); });

      const fileInputRef = useRef(null);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-5 bg-white p-6 rounded-2xl border border-purple-100 shadow-sm space-y-4">
            <div className="flex items-center justify-between border-b border-purple-100 pb-3">
              <h2 className="text-xl font-bold text-purple-700 flex items-center gap-2">
                <i data-lucide="plus" className="w-5 h-5 text-purple-600"></i> {t.addWord}
              </h2>
              <div className="flex items-center gap-2">
                <button
                  onClick={onExportJSON}
                  className="text-xs bg-white/60 px-2.5 py-1 rounded-lg border border-purple-100 text-purple-700 font-semibold"
                >
                  {t.exportBtn}
                </button>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="application/json"
                  onChange={(e) => onImportJSON(e.target.files?.[0])}
                  className="hidden"
                />
                <button
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className="text-xs bg-white/60 px-2.5 py-1 rounded-lg border border-purple-100 text-purple-700 font-semibold"
                >
                  {t.importBtn}
                </button>
              </div>
            </div>

            <form onSubmit={onAddWord} className="space-y-4">
              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="text-xs font-semibold text-slate-600 uppercase">{t.hanzi}</label>
                  <div className="flex items-center gap-2">
                    {!hasGeminiKey && (
                      <span className="text-xs text-amber-700 bg-amber-50 px-2 py-1 rounded">{t.noApiKeyNotice}</span>
                    )}
                    <button
                      type="button"
                      onClick={handleAiAutofill}
                      disabled={isAiAutofilling || !newHanzi.trim() || !hasGeminiKey}
                      className="text-xs font-bold text-purple-700 bg-purple-100 hover:bg-purple-200 px-2.5 py-1 rounded-lg flex items-center gap-1 transition-all disabled:opacity-50"
                    >
                      <i data-lucide="sparkles" className="w-3.5 h-3.5 text-amber-500"></i>
                      {isAiAutofilling ? t.generating : t.aiAutofill}
                    </button>
                  </div>
                </div>
                <input
                  type="text"
                  value={newHanzi}
                  onChange={(e) => setNewHanzi(e.target.value)}
                  placeholder="Nhập Hán tự: 学习 / 苹果 / 坚持..."
                  className="w-full px-3.5 py-2.5 border border-purple-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none text-lg font-medium"
                  required
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">{t.pinyin}</label>
                  <input
                    type="text"
                    value={newPinyin}
                    onChange={(e) => setNewPinyin(e.target.value)}
                    placeholder="xué xí"
                    className="w-full px-3 py-2 border border-purple-200 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">{t.hskLevel}</label>
                  <select
                    value={selectedHsk}
                    onChange={(e) => setSelectedHsk(e.target.value)}
                    className="w-full px-3 py-2 border border-purple-200 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-sm font-semibold text-purple-900 bg-white"
                  >
                    {['HSK1', 'HSK2', 'HSK3', 'HSK4', 'HSK5', 'HSK6'].map(lvl => (
                      <option key={lvl} value={lvl}>{lvl}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">{t.meaningVi}</label>
                  <input
                    type="text"
                    value={newMeaningVi}
                    onChange={(e) => setNewMeaningVi(e.target.value)}
                    placeholder="Học tập"
                    className="w-full px-3 py-2 border border-purple-200 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">{t.meaningEn}</label>
                  <input
                    type="text"
                    value={newMeaningEn}
                    onChange={(e) => setNewMeaningEn(e.target.value)}
                    placeholder="To study"
                    className="w-full px-3 py-2 border border-purple-200 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-sm"
                  />
                </div>
              </div>

              <p className="text-[11px] text-purple-700/80 leading-relaxed bg-purple-50 p-2.5 rounded-lg border border-purple-100 flex items-start gap-1.5">
                <i data-lucide="lightbulb" className="w-4 h-4 text-purple-600 flex-shrink-0 mt-0.5"></i>
                {t.aiNotice}
              </p>

              {aiGeneratedExample && (
                <div className="p-3 bg-purple-50/60 rounded-xl border border-purple-200 text-xs space-y-1">
                  <span className="inline-block bg-purple-200 text-purple-900 font-bold text-[10px] px-2 py-0.5 rounded">
                    {t.exampleLabel} ({selectedHsk})
                  </span>
                  <p className="font-semibold text-slate-800 text-sm">{aiGeneratedExample.exampleHanzi}</p>
                  <p className="text-purple-700 italic">{aiGeneratedExample.examplePinyin}</p>
                  <p className="text-slate-600">
                    {lang === 'vi' ? aiGeneratedExample.exampleTranslationVi : aiGeneratedExample.exampleTranslationEn}
                  </p>
                </div>
              )}

              <button
                type="submit"
                className="w-full bg-purple-600 text-white font-bold py-3 rounded-xl hover:bg-purple-700 transition-all shadow-md text-sm flex justify-center items-center gap-2"
              >
                <i data-lucide="save" className="w-4 h-4"></i> {t.saveWord}
              </button>
            </form>
          </div>

          <div className="lg:col-span-7 bg-white p-6 rounded-2xl border border-purple-100 shadow-sm space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-purple-100 pb-3">
              <h2 className="text-xl font-bold text-purple-700 flex items-center gap-2">
                <span>{t.wordList}</span>
                <span className="text-xs font-bold bg-purple-100 text-purple-800 px-2.5 py-1 rounded-full">
                  {allVocabCount} {lang === 'vi' ? 'từ' : 'words'}
                </span>
              </h2>

              <div className="relative">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder={t.searchPlaceholder}
                  className="pl-3 pr-3 py-1.5 text-xs border border-purple-200 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none w-full sm:w-56"
                />
              </div>
            </div>

            {vocabList.length === 0 ? (
              <div className="text-center py-16 text-slate-400 space-y-3">
                <i data-lucide="book-open" className="w-16 h-16 mx-auto text-purple-300"></i>
                <p className="text-slate-600 font-medium">{t.noWords}</p>
              </div>
            ) : (
              <div className="space-y-3 max-h-[550px] overflow-y-auto pr-1">
                {vocabList.map((item) => (
                  <div
                    key={item.id}
                    className="p-4 rounded-xl bg-purple-50/30 hover:bg-purple-50/70 border border-purple-100 transition-all flex flex-col sm:flex-row justify-between gap-3 items-start sm:items-center"
                  >
                    <div className="space-y-1.5 flex-1">
                      <div className="flex items-baseline gap-2.5 flex-wrap">
                        <span className="text-2xl font-bold text-slate-800">{item.hanzi}</span>
                        <span className="text-sm font-semibold text-purple-600">{item.pinyin}</span>
                        <span className="text-[10px] font-bold bg-purple-100 text-purple-800 px-2 py-0.5 rounded">
                          {item.hskLevel}
                        </span>
                      </div>
                      <div className="flex gap-4 text-xs font-medium text-slate-700">
                        {item.meaningVi && <span>🇻🇳 {item.meaningVi}</span>}
                        {item.meaningEn && <span>🇬🇧 {item.meaningEn}</span>}
                      </div>

                      {item.exampleHanzi && (
                        <div className="text-xs bg-white p-3 rounded-lg border border-purple-100 text-slate-700 mt-2 space-y-0.5">
                          <p className="font-semibold text-slate-800">{item.exampleHanzi}</p>
                          <p className="text-purple-600 text-[11px] italic">{item.examplePinyin}</p>
                          <p className="text-slate-500 text-[11px]">{item.exampleTranslation}</p>
                        </div>
                      )}
                    </div>

                    <button
                      onClick={() => onDeleteWord(item.id)}
                      className="text-slate-400 hover:text-rose-500 p-2 rounded-lg hover:bg-rose-50 transition-all self-end sm:self-center"
                    >
                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // AI TUTOR TAB COMPONENT
    function AiTutorTab({ vocabList, lang, t, hasGeminiKey }) {
      const [exercise, setExercise] = useState(null);
      const [userAnswer, setUserAnswer] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [isEvaluating, setIsEvaluating] = useState(false);
      const [evaluation, setEvaluation] = useState(null);

      useEffect(() => { lucide.createIcons(); });

      const generateAiExercise = async () => {
        if (vocabList.length === 0) {
          alert(lang === 'vi' ? 'Vui lòng thêm ít nhất 1 từ vựng vào bộ từ trước!' : 'Please add at least 1 word first!');
          return;
        }

        if (!hasGeminiKey) {
          alert(lang === 'vi' ? 'Chưa có khóa Gemini. AI tạm tắt.' : 'No Gemini key configured. AI is disabled.');
          return;
        }

        setIsGenerating(true);
        setEvaluation(null);
        setUserAnswer('');

        const wordListStr = vocabList.map(v => `${v.hanzi} (${v.pinyin} - ${v.meaningVi || v.meaningEn})`).join(', ');
        const systemPrompt = `You are a Chinese language tutor. Construct 1 application exercise using target words: ${wordListStr}.\nReturn JSON:\n- title: Short exercise title\n- instruction: Instruction for user\n- targetWordsUsed: array of words tested\n- hint: helpful hint`;

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: `Words: ${wordListStr}` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json" }
              })
            }
          );
          const data = await response.json();
          const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          const parsed = safeParseJSON(jsonText);
          if (parsed) setExercise(parsed);
          else {
            console.warn('Invalid exercise JSON from AI', jsonText);
            alert('AI returned invalid exercise data');
          }
        } catch (err) {
          console.error(err);
          alert('Failed to generate exercise');
        }
        setIsGenerating(false);
      };

      const handleEvaluateAnswer = async () => {
        if (!userAnswer.trim()) return;

        if (!hasGeminiKey) {
          alert(lang === 'vi' ? 'Chưa có khóa Gemini. AI tạm tắt.' : 'No Gemini key configured. AI is disabled.');
          return;
        }

        setIsEvaluating(true);
        const systemPrompt = `You are an expert Chinese Examiner. Analyze user's answer.\nReturn JSON:\n- score: number (0-100)\n- overallComment: summary comment\n- correctedSentence: correct version\n- grammarFeedback: explanation\n- suggestion: tip for improvement`;

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: `Exercise: ${exercise?.instruction}\nSubmission: "${userAnswer}"` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json" }
              })
            }
          );
          const data = await response.json();
          const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          const parsed = safeParseJSON(jsonText);
          if (parsed) setEvaluation(parsed);
          else {
            console.warn('Invalid evaluation JSON', jsonText);
            alert('AI returned invalid evaluation data');
          }
        } catch (err) {
          console.error(err);
          alert('Failed to evaluate answer');
        }
        setIsEvaluating(false);
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-purple-100 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold text-purple-700 flex items-center gap-2">
                <i data-lucide="sparkles" className="w-5 h-5 text-amber-500"></i> {t.aiTutorTitle}
              </h2>
              <p className="text-xs text-slate-600 mt-1">{t.aiTutorDesc}</p>
            </div>

            <div className="flex flex-col items-end gap-2">
              {!hasGeminiKey && (
                <div className="text-xs text-amber-700 bg-amber-50 px-2 py-1 rounded">{t.noApiKeyNotice}</div>
              )}
              <button
                onClick={generateAiExercise}
                disabled={isGenerating || vocabList.length === 0 || !hasGeminiKey}
                className="bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs px-5 py-3 rounded-xl transition-all shadow-md flex items-center gap-2 disabled:opacity-50"
              >
                <i data-lucide="zap" className="w-4 h-4"></i>
                {t.generateExerciseBtn}
              </button>
            </div>
          </div>

          {exercise && (
            <div className="bg-white p-6 rounded-2xl border border-purple-100 shadow-sm space-y-4">
              <div className="flex items-center justify-between border-b border-purple-100 pb-3">
                <span className="text-xs font-bold text-purple-700 uppercase">
                  📝 {exercise.title}
                </span>
              </div>

              <div className="bg-purple-50/50 p-4 rounded-xl border border-purple-100 space-y-2">
                <p className="text-base font-semibold text-slate-800">{exercise.instruction}</p>
              </div>

              <textarea
                rows={3}
                value={userAnswer}
                onChange={(e) => setUserAnswer(e.target.value)}
                placeholder="Nhập câu tiếng Trung của bạn tại đây..."
                className="w-full p-3.5 border border-purple-200 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none text-base"
              />

              <button
                onClick={handleEvaluateAnswer}
                disabled={isEvaluating || !userAnswer.trim() || !hasGeminiKey}
                className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition-all shadow-md text-sm disabled:opacity-50"
              >
                {isEvaluating ? t.generating : t.submitAnswerBtn}
              </button>
            </div>
          )}

          {evaluation && (
            <div className="bg-white p-6 rounded-2xl border border-purple-200 shadow-md space-y-4">
              <div className="flex items-center justify-between border-b border-purple-100 pb-3">
                <h3 className="text-lg font-bold text-purple-800">{t.aiGradingTitle}</h3>
                <span className="text-base font-extrabold bg-purple-100 text-purple-800 px-3 py-1 rounded-full">
                  {t.gradeScore}: {evaluation.score}/100
                </span>
              </div>

              <div className="space-y-3 text-sm">
                <p className="p-3 bg-slate-50 rounded-xl">{evaluation.overallComment}</p>
                {evaluation.correctedSentence && (
                  <p className="p-3 bg-emerald-50 text-emerald-950 font-bold rounded-xl">
                    Sửa câu: {evaluation.correctedSentence}
                  </p>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // PRACTICE TAB COMPONENT
    function PracticeTab({ vocabList, lang, t }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [showHint, setShowHint] = useState(false);
      const [feedback, setFeedback] = useState(null);
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);

      const currentWord = vocabList[currentIndex] || vocabList[0];

      useEffect(() => {
        lucide.createIcons();
        clearCanvas();
        setFeedback(null);
        setShowHint(false);
      }, [currentIndex, vocabList]);

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches?.[0]?.clientX) - rect.left;
        const y = (e.clientY || e.touches?.[0]?.clientY) - rect.top;

        ctx.beginPath();
        ctx.moveTo(x, y);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches?.[0]?.clientX) - rect.left;
        const y = (e.clientY || e.touches?.[0]?.clientY) - rect.top;

        ctx.lineTo(x, y);
        ctx.strokeStyle = '#7e22ce';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.stroke();
      };

      const stopDrawing = () => setIsDrawing(false);

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#e9d5ff';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.moveTo(0, canvas.height / 2);
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();
        ctx.setLineDash([]);
      };

      const handleEvaluate = () => {
        setFeedback({ type: 'success', text: t.correct, points: 100 });
      };

      if (!currentWord) {
        return (
          <div className="bg-white p-12 rounded-2xl border border-purple-100 text-center max-w-lg mx-auto">
            <p className="text-slate-600 font-medium">{t.noWords}</p>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-purple-100 shadow-sm flex flex-col md:flex-row gap-6 items-center justify-between">
            <div className="space-y-3 text-center md:text-left flex-1">
              <span className="bg-purple-100 text-purple-700 font-bold text-xs px-3 py-1 rounded-full">
                {currentIndex + 1} / {vocabList.length}
              </span>
              <h2 className="text-4xl font-extrabold text-slate-800">
                {showHint ? currentWord.hanzi : '？'}
              </h2>
              <p className="text-lg font-semibold text-purple-600">{currentWord.pinyin}</p>
              <p className="text-sm text-slate-600">{lang === 'vi' ? currentWord.meaningVi : currentWord.meaningEn}</p>

              <button
                onClick={() => setShowHint(!showHint)}
                className="text-xs text-purple-700 bg-purple-50 px-3 py-1.5 rounded-lg border border-purple-200"
              >
                {t.canvasHint}
              </button>
            </div>

            <div className="flex flex-col items-center gap-3">
              <div className="border-2 border-purple-200 rounded-2xl bg-purple-50/20 overflow-hidden">
                <canvas
                  ref={canvasRef}
                  width={260}
                  height={260}
                  onMouseDown={startDrawing}
                  onMouseMove={draw}
                  onMouseUp={stopDrawing}
                  onMouseLeave={stopDrawing}
                  onTouchStart={startDrawing}
                  onTouchMove={draw}
                  onTouchEnd={stopDrawing}
                  className="cursor-crosshair"
                />
              </div>

              <div className="flex gap-2">
                <button onClick={clearCanvas} className="text-xs bg-slate-100 px-3 py-2 rounded-xl">
                  {t.canvasClear}
                </button>
                <button onClick={handleEvaluate} className="text-xs bg-purple-600 text-white px-4 py-2 rounded-xl font-bold">
                  {t.canvasSubmit}
                </button>
              </div>
            </div>
          </div>

          {feedback && (
            <div className="p-4 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200">
              {feedback.text} (+{feedback.points} pts)
            </div>
          )}

          <div className="flex justify-between items-center">
            <button
              onClick={() => setCurrentIndex((prev) => Math.max(0, prev - 1))}
              disabled={currentIndex === 0}
              className="px-4 py-2 text-sm bg-white border rounded-xl disabled:opacity-40"
            >
              Trước
            </button>
            <button
              onClick={() => setCurrentIndex((prev) => Math.min(vocabList.length - 1, prev + 1))}
              disabled={currentIndex === vocabList.length - 1}
              className="px-4 py-2 text-sm bg-purple-600 text-white rounded-xl disabled:opacity-40"
            >
              Tiếp
            </button>
          </div>
        </div>
      );
    }

    // QUIZ TAB COMPONENT
    function QuizTab({ vocabList, lang, t }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [score, setScore] = useState(0);

      useEffect(() => { lucide.createIcons(); });

      if (!vocabList.length) {
        return <div className="text-center py-12 text-slate-500">{t.noWords}</div>;
      }

      const currentWord = vocabList[currentIndex % vocabList.length];

      return (
        <div className="max-w-2xl mx-auto bg-white p-6 rounded-2xl border border-purple-100 shadow-sm space-y-6">
          <div className="text-center py-6 bg-purple-50/40 rounded-xl space-y-2">
            <h3 className="text-5xl font-extrabold text-slate-800">{currentWord.hanzi}</h3>
            <p className="text-base text-purple-600 font-semibold">{currentWord.pinyin}</p>
          </div>

          <div className="p-4 border rounded-xl text-center">
            Nghĩa: {lang === 'vi' ? currentWord.meaningVi : currentWord.meaningEn}
          </div>

          <button
            onClick={() => setCurrentIndex(prev => prev + 1)}
            className="w-full bg-purple-600 text-white font-bold py-3 rounded-xl"
          >
            {t.nextQuestion}
          </button>
        </div>
      );
    }

    // GAME TAB COMPONENT
    function GameTab({ vocabList, lang, t }) {
      useEffect(() => { lucide.createIcons(); });

      if (!vocabList.length) {
        return <div className="text-center py-12 text-slate-500">{t.noWords}</div>;
      }

      return (
        <div className="max-w-3xl mx-auto bg-white p-6 rounded-2xl border text-center space-y-4">
          <h2 className="text-xl font-bold text-purple-700">{t.gameTitle}</h2>
          <p className="text-xs text-slate-600">{t.gameSubtitle}</p>
          <p className="text-sm text-purple-600">Thêm nhiều từ vựng để bắt đầu chuỗi bài tập ghép từ!</p>
        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
